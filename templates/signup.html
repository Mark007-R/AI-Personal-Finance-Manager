{% extends '_auth.html' %}
{% from '_macros.html' import icon with context %}
{% block title %}Create account{% endblock %}

{% block form %}
<p class="eyebrow">Get started</p>
<h2 class="display" style="margin-top:.6rem">Create your <em>account</em>.</h2>
<p class="lede">Free, private, and ready in under a minute.</p>

<form id="signup-form" method="post" action="{{ url_for('signup_bp.signup') }}" data-auth-form novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-error" role="alert" data-form-error>{{ icon('alert', 'i-sm') }}<span></span></div>
    <div class="field">
        <label for="name">First name</label>
        <input type="text" id="name" name="name" required maxlength="120" autocomplete="given-name" placeholder="What should we call you?">
    </div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <div class="pw">
            <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
            <button type="button" class="icon-btn" data-toggle-password aria-label="Show password">{{ icon('eye') }}</button>
        </div>
    </div>
    <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" placeholder="Type it again">
    </div>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px"><span class="spinner"></span><span>Create account</span></button>
</form>

<p class="auth-switch">Already have an account? <a href="{{ url_for('login_bp.login') }}">Sign in</a></p>
{% endblock %}
