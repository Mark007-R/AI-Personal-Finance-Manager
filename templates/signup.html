<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='paper.css') }}">
    <style>
        /* Palette, fonts and the paper ground come from static/paper.css. */

        * {
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 93.75%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
            line-height: 1.6;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 2.25rem 2rem 2rem;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
        }

        .title {
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: var(--font-display);
            font-size: 2.3rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.02em;
            color: var(--ink);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: .45rem;
            font-family: var(--font-mono);
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .form-group input {
            width: 100%;
            padding: .75rem 1rem;
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--ease), box-shadow var(--ease);
        }

        .form-group input::placeholder {
            color: var(--placeholder);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            margin-top: .5rem;
            padding: .85rem 1.25rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 600;
            color: var(--on-accent);
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 2px 12px var(--accent-glow);
            transition: background-color var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
        }

        button:hover {
            background: var(--accent-strong);
            border-color: var(--accent-strong);
            transform: translateY(-1px);
            box-shadow: 0 10px 28px var(--accent-glow);
        }

        /* the script disables the button while the request is in flight */
        button:disabled,
        button:disabled:hover {
            color: var(--ink-3);
            background: var(--line-strong);
            border-color: var(--line-strong);
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .connect-title,
        .login-redirect {
            text-align: center;
            margin-top: 1rem;
        }

        .connect-title {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.75rem 0 1rem;
            font-family: var(--font-mono);
            font-size: .7rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .connect-title::before,
        .connect-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .social-links {
            text-align: center;
            margin-bottom: 1rem;
        }

        /* no font-family here: the .fa class supplies the icon font */
        .social-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            margin: 0 .2rem;
            font-size: 1.05rem;
            text-decoration: none;
            color: var(--ink-2);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            transition: color var(--ease), background-color var(--ease), border-color var(--ease), transform var(--ease);
        }

        .social-links a:hover {
            color: var(--accent);
            background: var(--accent-tint);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .login-redirect {
            font-size: .95rem;
            color: var(--ink-2);
        }

        .login-redirect a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-redirect a:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }

        .form-message {
            margin-top: 1rem;
            padding: .7rem 1rem;
            text-align: center;
            font-size: .9rem;
            font-weight: 500;
            color: var(--ink-2);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
        }

        .form-message:empty {
            display: none;
        }

        /* The page script sets style.color = 'green' | 'red' on #form-message.
           Map those inline colours onto the paper status colours (JS untouched). */
        #form-message[style*="green"] {
            color: var(--ok) !important;
            background: var(--ok-tint);
            border-color: var(--ok-line);
        }

        #form-message[style*="red"] {
            color: var(--bad) !important;
            background: var(--bad-tint);
            border-color: var(--bad-line);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <main class="container">
        <h1 class="title">Sign Up</h1>
        <form id="signup-form" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required
                    placeholder="Confirm your password">
            </div>
            <div class="form-group">
                <button type="submit" id="submit-button">Sign Up</button>
            </div>
            <div id="form-message" class="form-message"></div>
        </form>

        <h3 class="connect-title">Connect with us</h3>
        <div class="social-links">
            <a href="#" class="fa fa-facebook"></a>
            <a href="#" class="fa fa-twitter"></a>
            <a href="#" class="fa fa-google"></a>
            <a href="#" class="fa fa-linkedin"></a>
        </div>

        <p class="login-redirect">Already have an account? <a href="{{ url_for('login_bp.login') }}">Login here</a></p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signup-form');
            const messageDiv = document.getElementById('form-message');
            const submitButton = document.getElementById('submit-button');

            form.addEventListener('submit', async function (event) {
                event.preventDefault();
                messageDiv.textContent = '';
                submitButton.disabled = true;

                const formData = new FormData(form);
                try {
                    const response = await fetch("{{ url_for('signup_bp.signup') }}", {
                        method: 'POST',
                        body: formData
                    });
                    const data = await response.json();

                    if (data.success) {
                        messageDiv.textContent = 'Sign up successful! Redirecting to login...';
                        messageDiv.style.color = 'green';
                        setTimeout(() => {
                            window.location.href = "{{ url_for('login_bp.login') }}";
                        }, 2000);
                    } else {
                        messageDiv.textContent = data.message;
                        messageDiv.style.color = 'red';
                        submitButton.disabled = false;
                    }
                } catch (error) {
                    console.error('Error:', error);
                    messageDiv.textContent = 'An error occurred. Please try again.';
                    messageDiv.style.color = 'red';
                    submitButton.disabled = false;
                }
            });
        });
    </script>
</body>

</html>
