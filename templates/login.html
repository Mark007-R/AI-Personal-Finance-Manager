<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='paper.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* Palette, fonts and the paper ground come from static/paper.css. */

        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 0;
            overflow-x: hidden;
            font-size: 15px;
            line-height: 1.6;
            color: var(--ink);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 1rem;
        }

        .form-container {
            padding: 2.25rem 2rem 2rem;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
        }

        .title {
            margin-bottom: 1.5rem;
            text-align: center;
            font-family: var(--font-display);
            font-size: 2.1rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -.02em;
            color: var(--ink);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: .45rem;
            font-family: var(--font-mono);
            font-size: .68rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .form-group input {
            width: 100%;
            padding: .75rem 1rem;
            font-family: var(--font-body);
            font-size: .95rem;
            color: var(--ink);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            outline: none;
            transition: border-color var(--ease), box-shadow var(--ease);
        }

        .form-group input::placeholder {
            color: var(--placeholder);
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button {
            width: 100%;
            margin-top: .5rem;
            padding: .8rem 1.25rem;
            font-family: var(--font-body);
            font-size: .95rem;
            font-weight: 600;
            color: var(--on-accent);
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 2px 12px var(--accent-glow);
            transition: background-color var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
        }

        button:hover,
        button:focus-visible {
            background: var(--accent-strong);
            border-color: var(--accent-strong);
            transform: translateY(-1px);
            box-shadow: 0 10px 28px var(--accent-glow);
        }

        button:disabled {
            color: var(--ink-3);
            background: var(--line-strong);
            border-color: var(--line-strong);
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .connect-title {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.75rem 0 1rem;
            font-family: var(--font-mono);
            font-size: .66rem;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--ink-3);
        }

        .connect-title::before,
        .connect-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .social-icons {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        /* no font-family here: the .fa class supplies the icon font */
        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            margin: 0 .2rem;
            font-size: 1rem;
            text-decoration: none;
            color: var(--ink-2);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            transition: color var(--ease), background-color var(--ease), border-color var(--ease), transform var(--ease);
        }

        .social-icons a:hover {
            color: var(--accent);
            background: var(--accent-tint);
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .signup-redirect {
            text-align: center;
            font-size: .9rem;
            color: var(--ink-2);
        }

        .signup-redirect a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-redirect a:hover {
            color: var(--accent-strong);
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="login-section">
            <div class="form-container">
                <h1 class="title">Login</h1>
                <form id="login-form" method="post">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email" />
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password"
                            autocomplete="off" />
                    </div>
                    <button type="submit">Login</button>
                </form>

                <h3 class="connect-title">Connect with</h3>
                <div class="social-icons">
                    <a href="#" class="fa fa-facebook"></a>
                    <a href="#" class="fa fa-twitter"></a>
                    <a href="#" class="fa fa-google"></a>
                    <a href="#" class="fa fa-linkedin"></a>
                </div>

                <p class="signup-redirect">
                    Don't have an account? <a href="{{ url_for('signup_bp.signup') }}">Sign Up</a>
                </p>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();

                const formData = new FormData(form);
                try {
                    const response = await fetch("{{ url_for('login_bp.login') }}", {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    if (data.success) {
                        alert('Login successful!');
                        window.location.href = "{{ url_for('dashboard') }}";  // Replace with your dashboard route
                    } else {
                        alert('Login failed: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error:', error);
                    document.getElementById("error-message").innerText = data.message;
                }
            });
        });
    </script>
</body>

</html>
