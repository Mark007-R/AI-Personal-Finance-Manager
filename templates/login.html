{% extends '_auth.html' %}
{% from '_macros.html' import icon with context %}
{% block title %}Sign in{% endblock %}

{% block form %}
<p class="eyebrow">Welcome back</p>
<h2 class="display" style="margin-top:.6rem">Sign in to your <em>ledger</em>.</h2>
<p class="lede">Pick up where you left off.</p>

<form id="login-form" method="post" action="{{ url_for('login_bp.login') }}" data-auth-form novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-error" role="alert" data-form-error>{{ icon('alert', 'i-sm') }}<span></span></div>
    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="field">
        <label for="password">Password</label>
        <div class="pw">
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Your password">
            <button type="button" class="icon-btn" data-toggle-password aria-label="Show password">{{ icon('eye') }}</button>
        </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px"><span class="spinner"></span><span>Sign in</span></button>
</form>

<p class="auth-switch">New to FinTrack? <a href="{{ url_for('signup_bp.signup') }}">Create an account</a></p>
{% endblock %}
