<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fefaf5">
    <title>{% block title %}FinTrack{% endblock %} · FinTrack</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231D6B3A'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='18' font-style='italic' font-weight='700' fill='%23fefaf5' text-anchor='middle'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='paper.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>

<body class="{% block body_class %}{% endblock %}">
    {% include '_icons.html' %}
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>

</html>
